# En-têtes de sécurité. Le HSTS est ajouté par l'Apache de 192.168.11.131 (terminaison HTTPS).
# CSP : n'autoriser que les domaines réellement utilisés par le site (à adapter par repo).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://unpkg.com 'wasm-unsafe-eval' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com; font-src 'self' data: https://unpkg.com https://fonts.gstatic.com; img-src 'self' data: blob: https://prod.spline.design; connect-src 'self' blob: data: https://prod.spline.design https://unpkg.com https://www.gstatic.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
